<svg xmlns="http://www.w3.org/2000/svg" width="380" height="310">
  <style>
    .header { font: bold 13px sans-serif; fill: #fff; }
    .cell { font: 12px sans-serif; fill: #333; }
    .pin { font: bold 12px sans-serif; fill: #333; }
    .box { stroke: #444; fill: #fafafa; rx: 2; }
    .headbox { stroke: #444; fill: #4a6fa5; rx: 2; }
  </style>

  <!-- En-têtes -->
  <rect x="10" y="10" width="40" height="28" class="headbox"/>
  <text x="30" y="29" text-anchor="middle" class="header">Pin</text>

  <rect x="50" y="10" width="90" height="28" class="headbox"/>
  <text x="95" y="29" text-anchor="middle" class="header">GPIO</text>

  <rect x="140" y="10" width="230" height="28" class="headbox"/>
  <text x="245" y="29" text-anchor="middle" class="header">Fonction</text>

  <!-- Lignes -->
  <!-- Ligne 1 -->
  <rect x="10" y="40" width="40" height="26" class="box"/>
  <text x="30" y="58" text-anchor="middle" class="pin">1</text>
  <rect x="50" y="40" width="90" height="26" class="box"/>
  <text x="95" y="58" text-anchor="middle" class="cell">VDD</text>
  <rect x="140" y="40" width="230" height="26" class="box"/>
  <text x="245" y="58" text-anchor="middle" class="cell">+3,3V</text>

  <!-- Ligne 2 -->
  <rect x="10" y="66" width="40" height="26" class="box"/>
  <text x="30" y="84" text-anchor="middle" class="pin">2</text>
  <rect x="50" y="66" width="90" height="26" class="box"/>
  <text x="95" y="84" text-anchor="middle" class="cell">GPIO13</text>
  <rect x="140" y="66" width="230" height="26" class="box"/>
  <text x="245" y="84" text-anchor="middle" class="cell">I²C CLK / JTAG TCK / HSPI D</text>

  <!-- Ligne 3 -->
  <rect x="10" y="92" width="40" height="26" class="box"/>
  <text x="30" y="110" text-anchor="middle" class="pin">3</text>
  <rect x="50" y="92" width="90" height="26" class="box"/>
  <text x="95" y="110" text-anchor="middle" class="cell">GND</text>
  <rect x="140" y="92" width="230" height="26" class="box"/>
  <text x="245" y="110" text-anchor="middle" class="cell">GND</text>

  <!-- Ligne 4 -->
  <rect x="10" y="118" width="40" height="26" class="box"/>
  <text x="30" y="136" text-anchor="middle" class="pin">4</text>
  <rect x="50" y="118" width="90" height="26" class="box"/>
  <text x="95" y="136" text-anchor="middle" class="cell">GPIO14</text>
  <rect x="140" y="118" width="230" height="26" class="box"/>
  <text x="245" y="136" text-anchor="middle" class="cell">I²C DATA / JTAG TMS / HSPI CLK</text>

  <!-- Ligne 5 -->
  <rect x="10" y="144" width="40" height="26" class="box"/>
  <text x="30" y="162" text-anchor="middle" class="pin">5</text>
  <rect x="50" y="144" width="90" height="26" class="box"/>
  <text x="95" y="162" text-anchor="middle" class="cell">GPIO15</text>
  <rect x="140" y="144" width="230" height="26" class="box"/>
  <text x="245" y="162" text-anchor="middle" class="cell">JTAG TDO / HSPI CS0</text>

  <!-- Ligne 6 -->
  <rect x="10" y="170" width="40" height="26" class="box"/>
  <text x="30" y="188" text-anchor="middle" class="pin">6</text>
  <rect x="50" y="170" width="90" height="26" class="box"/>
  <text x="95" y="188" text-anchor="middle" class="cell">GPIO12</text>
  <rect x="140" y="170" width="230" height="26" class="box"/>
  <text x="245" y="188" text-anchor="middle" class="cell">JTAG TDI / HSPI Q</text>

  <!-- Ligne 7 -->
  <rect x="10" y="196" width="40" height="26" class="box"/>
  <text x="30" y="214" text-anchor="middle" class="pin">7</text>
  <rect x="50" y="196" width="90" height="26" class="box"/>
  <text x="95" y="214" text-anchor="middle" class="cell">EN</text>
  <rect x="140" y="196" width="230" height="26" class="box"/>
  <text x="245" y="214" text-anchor="middle" class="cell">Reset / Enable</text>

  <!-- Ligne 8 -->
  <rect x="10" y="222" width="40" height="26" class="box"/>
  <text x="30" y="240" text-anchor="middle" class="pin">8</text>
  <rect x="50" y="222" width="90" height="26" class="box"/>
  <text x="95" y="240" text-anchor="middle" class="cell">GPIO0</text>
  <rect x="140" y="222" width="230" height="26" class="box"/>
  <text x="245" y="240" text-anchor="middle" class="cell">Boot mode (IO0)</text>

  <!-- Ligne 9 -->
  <rect x="10" y="248" width="40" height="26" class="box"/>
  <text x="30" y="266" text-anchor="middle" class="pin">9</text>
  <rect x="50" y="248" width="90" height="26" class="box"/>
  <text x="95" y="266" text-anchor="middle" class="cell">GPIO3</text>
  <rect x="140" y="248" width="230" height="26" class="box"/>
  <text x="245" y="266" text-anchor="middle" class="cell">UART0 RX</text>

  <!-- Ligne 10 -->
  <rect x="10" y="274" width="40" height="26" class="box"/>
  <text x="30" y="292" text-anchor="middle" class="pin">10</text>
  <rect x="50" y="274" width="90" height="26" class="box"/>
  <text x="95" y="292" text-anchor="middle" class="cell">GPIO1</text>
  <rect x="140" y="274" width="230" height="26" class="box"/>
  <text x="245" y="292" text-anchor="middle" class="cell">UART0 TX</text>

</svg>
